<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#131915">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikona-192.png" type="image/png">
<link rel="apple-touch-icon" href="ikona-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wirkowice">
<style>body{margin:0}[hidden]{display:none!important}</style>
<script src="ustawienia.js"></script>
<script>if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</head>
<body>
<title>Urzędowe · Moje Wirkowice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="wspolne.css">
<style>
.filtry{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.filtry button{font:inherit;font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.filtry button[aria-pressed="true"]{background:var(--h);border-color:var(--h);color:#10160F}
.ur h3{font-family:var(--f-display);font-size:18px;line-height:1.25;margin:0 0 2px}
.ur .gdzie{color:var(--muted);font-size:14px;margin:0}
.ur .godz{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:8px 0 0;font-size:15px}
.ur .op{margin:6px 0 0;font-size:15px}
.ur .zr{font-size:12px;color:var(--muted);margin:8px 0 0}
.ur .zr a{color:var(--muted)}
.stan{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.stan.tak{background:var(--green-soft);color:var(--green)}
.stan.nie{background:var(--alarm-soft);color:var(--alarm)}
.dzisg{font-size:13px;color:var(--muted)}
/* „Do kogo dzwonić” w urzędzie gminy: krótka lista z numerami wewnętrznymi */
.wew{display:flex;flex-direction:column;padding:4px 16px}
.wew a{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.wew a:last-child{border-bottom:0}
.wew b{font-variant-numeric:tabular-nums;font-size:14px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--h) 22%,var(--panel));color:var(--h);white-space:nowrap}
.wew-op{margin:0 0 8px;color:var(--muted);font-size:14px}
</style>

<main class="wrap h-stal">
  <a class="back" href="index.html">← Strona główna</a>
  <header class="naglowek">
    <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5"/><path d="M5 9v9M9.5 9v9M14.5 9v9M19 9v9"/><path d="M3 21h18M3 18h18"/></svg></span>
    <div><h1>Urzędowe</h1><p class="lead">Gmina Izbica, Krasnystaw, sprawy rolnika, poczta i szkoła. Przy każdym telefon, godziny i dojazd.</p></div>
  </header>

  <div class="filtry" role="group" aria-label="Pokaż">
    <button type="button" data-f="" aria-pressed="true">Wszystko</button>
    <button type="button" data-f="otwarte" aria-pressed="false">Otwarte teraz</button>
  </div>
  <div id="out"><p class="muted">Wczytuję…</p></div>
  <p class="muted" style="font-size:13px;margin-top:24px">Godziny mogą się zmienić, zwłaszcza w święta i dni wolne. Przed wyjazdem warto zadzwonić.</p>
</main>

<script src="dane.js"></script>
<script src="godziny.js"></script>
<script>
// Karta „Urzedowe”: rodzaj | nazwa | miejscowosc | adres | telefon | godziny | wspolrzedne | opis | zrodlo
const GRUPY_U=[
  {r:["gmina"],             t:"Gmina Izbica"},
  {r:["wewnetrzny"],        t:"W urzędzie gminy: do kogo dzwonić", lista:true},
  {r:["odpady"],            t:"Odpady wielkie i nietypowe"},
  {r:["rolnictwo"],         t:"Sprawy rolnika"},
  {r:["powiat"],            t:"Krasnystaw: starostwo i skarbówka"},
  {r:["poczta","bank"],     t:"Poczta i bank"},
  {r:["szkola","kultura"],  t:"Szkoła, kultura, biblioteka"},
];
// „84 618 30 34 wew. 23” → tel:+48846183034,23 (telefon sam wybierze numer wewnętrzny)
const telHref=t=>{ const [n,w]=(t||"").split(/wew\.?/i); const d=n.replace(/[^\d]/g,""); if(d.length<9) return "";
  return "tel:+48"+d.slice(-9)+(w&&w.replace(/\D/g,"")?","+w.replace(/\D/g,""):""); };
const telTxt=t=>(t||"").split(/wew/i)[0].trim();

let LISTA=[], FILTR="";
(async()=>{
  const u=await wczytaj("Urzedowe");
  LISTA=u.wiersze.filter(r=>r.nazwa).map(r=>({...miejsceZdrowia(r), k:(r.rodzaj||"").trim().toLowerCase().replace("ę","e")}));
  LISTA.sort((a,b)=>a.odl-b.odl);
  pokaz(); setInterval(pokaz,60000);
})();

function karta(p){
  const o=otwarte(p.godziny), tel=telHref(p.telefon);
  const cel=p.adres?encodeURIComponent(p.adres):(p.lat!=null?p.lat+","+p.lon:"");
  const zr=(p.zrodlo||"").split(/\s+/).filter(u=>/^https?:\/\//.test(u));
  return `<div class="card ur">
    <h3>${esc(p.nazwa)}</h3>
    ${p.miejscowosc?`<p class="gdzie">${esc(p.miejscowosc)}${p.odl<999?` · ok. ${kmTxt(p.odl)} od Wirkowic`:""}</p>`:""}
    ${p.adres?`<p class="gdzie">${esc(p.adres)}</p>`:""}
    ${p.godziny?`<p class="godz">${o===true?'<span class="stan tak">Otwarte teraz</span>':o===false?'<span class="stan nie">Teraz zamknięte</span>':""}<span>${esc(p.godziny)}</span>${naDzis(p.godziny)&&o!==null?`<span class="dzisg">(${esc(naDzis(p.godziny))})</span>`:""}</p>`:""}
    ${p.opis?`<p class="op">${esc(p.opis)}</p>`:""}
    <div class="btns">
      ${tel?`<a class="btn primary" href="${tel}">Zadzwoń ${esc(telTxt(p.telefon))}</a>`:""}
      ${p.adres?`<a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${cel}" target="_blank" rel="noopener">Dojazd</a>`:""}
    </div>
    ${zr.length?`<p class="zr">Źródło: ${zr.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(new URL(u).hostname.replace(/^www\./,""))}</a>`).join(", ")}</p>`:""}
  </div>`;
}
function listaWew(l){
  return `<p class="wew-op">Dzwonisz na numer urzędu, a telefon sam wybierze numer wewnętrzny.</p><div class="card wew">`+
    l.map(p=>{ const w=(p.telefon.split(/wew\.?/i)[1]||"").trim();
      return `<a href="${telHref(p.telefon)}"><span>${esc(p.nazwa)}</span><b>wew. ${esc(w)}</b></a>`; }).join("")+`</div>`;
}
function pokaz(){
  const out=document.getElementById("out");
  if(!LISTA.length){ out.innerHTML=`<div class="card empty" style="margin-top:16px"><p style="margin:0"><strong>Do uzupełnienia:</strong> karta „Urzedowe” w arkuszu.</p></div>`; return; }
  const ok=p=>!FILTR||otwarte(p.godziny)===true;
  const html=GRUPY_U.map(g=>{ const l=LISTA.filter(p=>g.r.includes(p.k)&&(g.lista?!FILTR:ok(p))); if(!l.length) return "";
    return `<section class="section"><h2>${g.t}</h2>${g.lista?listaWew(l):`<div class="list">${l.map(karta).join("")}</div>`}</section>`; }).join("");
  out.innerHTML=html||`<p class="muted" style="margin-top:20px">Teraz żaden z tych urzędów nie jest otwarty.</p>`;
}
document.querySelector(".filtry").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; FILTR=b.dataset.f;
  document.querySelectorAll(".filtry button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); pokaz();
});
</script>

</body>
</html>
