<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#131915">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikona-192.png" type="image/png">
<link rel="apple-touch-icon" href="ikona-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wirkowice">
<style>body{margin:0}[hidden]{display:none!important}</style>
<script src="ustawienia.js"></script>
<script>if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</head>
<body>
<title>Wywóz śmieci · Moje Wirkowice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="wspolne.css">
<style>
.next{padding:18px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.next .big{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.15;margin:2px 0}
/* kolejne terminy: równe kolumny — data | worek | rodzaj (wspólna siatka dla wszystkich wierszy) */
.terminy{display:grid;grid-template-columns:max-content max-content minmax(0,1fr);align-items:center}
.terminy .ik{padding-right:10px!important}
.terminy .ik .worki{gap:3px}
.terminy .d{padding-right:14px!important}
.terminy .row{display:contents}
.terminy .row>*{padding:12px 0;border-bottom:1px solid var(--line);align-self:stretch;display:flex;align-items:center}
.terminy .row:last-child>*{border-bottom:0}
.terminy .d{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.terminy .ik .worek{margin:0}
.terminy .r{min-width:0}
.minione .terminy{padding:4px 16px}
</style>

<main class="wrap h-mor">
  <a class="back" href="o-wirkowicach.html">← O Wirkowicach</a>
  <header class="naglowek">
    <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></span>
    <div><h1>Wywóz śmieci</h1><p class="lead">Kiedy wystawić worki i pojemniki. Harmonogram wspólny dla Wirkowic Pierwszych i Drugich.</p></div>
  </header>
  <div id="out"><p class="muted">Wczytuję…</p></div>
</main>

<script src="dane.js"></script>
<script>
// Kolory i ikony worków są w dane.js (kolorSmieci, worek)
// kilka rodzajów tego samego dnia → jeden wiersz z kilkoma workami
const dni=l=>{ const m=new Map(); l.forEach(r=>{ const k=r.d.getTime(); if(!m.has(k)) m.set(k,{d:r.d,r:[]}); m.get(k).r.push(r.rodzaj); }); return [...m.values()]; };
(async()=>{
  const s=await wczytaj("Smieci");
  const wsz=s.wiersze.map(r=>({d:data(r.data),rodzaj:r.rodzaj||"odpady"})).filter(r=>r.d);
  const lista=wsz.filter(r=>r.d>=dzis()).sort((a,b)=>a.d-b.d);
  // Minione: odbiory, które już były, od najświeższego
  const wiersz=g=>`<div class="row"><span class="d">${esc(kiedy(g.d))}</span><span class="ik"><span class="worki">${g.r.map(worek).join("")}</span></span><span class="r">${esc(g.r.join(", "))}</span></div>`;
  const byly=dni(wsz.filter(r=>r.d<dzis()).sort((a,b)=>b.d-a.d));
  const min=`<section class="section">${minione(byly.length,byly.slice(0,30).map(wiersz).join(""),"card terminy")}</section>`;
  const el=document.getElementById("out");
  if(!lista.length){ el.innerHTML=(s.przyklad?notkaPrzyklad:"")+'<div class="card empty"><p style="margin:0">Brak kolejnych terminów. Harmonogram na nowy rok jeszcze nie jest wpisany.</p></div>'+min; return; }
  const pierwszy=lista[0].d.getTime(), dzien=lista.filter(r=>r.d.getTime()===pierwszy);
  el.innerHTML=(s.przyklad?notkaPrzyklad:"")+
    `<div class="next${dniDo(lista[0].d)<=1?" pilne":""}"><p class="eyebrow" style="margin:0">Najbliższy wywóz</p>
      <p class="big">${esc(kiedy(lista[0].d))}</p>
      <p style="margin:0;line-height:1.9">${dzien.map(r=>`${worek(r.rodzaj)}${esc(r.rodzaj)}`).join("<br>")}</p>
      <p class="muted" style="margin:8px 0 0">${dniDo(lista[0].d)===1?"<strong>Wystaw dziś wieczorem.</strong> Odbiór jutro od godz. 7:00.":dniDo(lista[0].d)===0?"<strong>Wywóz jest dziś</strong> od godz. 7:00.":"Odbiór od godz. 7:00, więc wystaw worki dzień wcześniej wieczorem albo rano przed 7:00."}</p></div>
    <section class="section"><h2>Kolejne terminy</h2><div class="card terminy">`+
    dni(lista.slice(dzien.length)).slice(0,12).map(wiersz).join("")+
    `</div></section>`+min;
})();
</script>

</body>
</html>
