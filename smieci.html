<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#131915">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikona-192.png" type="image/png">
<link rel="apple-touch-icon" href="ikona-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wirkowice">
<style>body{margin:0}[hidden]{display:none!important}</style>
<script src="ustawienia.js"></script>
<script>if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</head>
<body>
<title>Wywóz śmieci · Moje Wirkowice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="wspolne.css">
<style>
.next{padding:18px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.next .big{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.15;margin:2px 0}
/* kolejne terminy: równe kolumny — data | worek | rodzaj (wspólna siatka dla wszystkich wierszy) */
.terminy{display:grid;grid-template-columns:max-content 34px minmax(0,1fr);align-items:center}
.terminy .d{padding-right:14px!important}
.terminy .row{display:contents}
.terminy .row>*{padding:12px 0;border-bottom:1px solid var(--line);align-self:stretch;display:flex;align-items:center}
.terminy .row:last-child>*{border-bottom:0}
.terminy .d{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.terminy .ik .worek{margin:0}
.terminy .r{min-width:0}
</style>

<main class="wrap">
  <a class="back" href="index.html">← Moje Wirkowice</a>
  <h1>Wywóz śmieci</h1>
  <p class="lead">Kiedy wystawić worki i pojemniki.</p>
  <div id="out"><p class="muted">Wczytuję…</p></div>
</main>

<script src="dane.js"></script>
<script>
// Kolory i ikony worków są w dane.js (kolorSmieci, worek)
(async()=>{
  const s=await wczytaj("Smieci");
  const lista=s.wiersze.map(r=>({d:data(r.data),rodzaj:r.rodzaj||"odpady"})).filter(r=>r.d&&r.d>=dzis()).sort((a,b)=>a.d-b.d);
  const el=document.getElementById("out");
  if(!lista.length){ el.innerHTML=(s.przyklad?notkaPrzyklad:"")+'<div class="card empty"><p style="margin:0">Brak dat w harmonogramie. Wpisz je w arkuszu, w karcie „Smieci”.</p></div>'; return; }
  const pierwszy=lista[0].d.getTime(), dzien=lista.filter(r=>r.d.getTime()===pierwszy);
  el.innerHTML=(s.przyklad?notkaPrzyklad:"")+
    `<div class="next${dniDo(lista[0].d)<=1?" pilne":""}"><p class="eyebrow" style="margin:0">Najbliższy wywóz</p>
      <p class="big">${esc(kiedy(lista[0].d))}</p>
      <p style="margin:0;line-height:1.9">${dzien.map(r=>`${worek(r.rodzaj)}${esc(r.rodzaj)}`).join("<br>")}</p>
      <p class="muted" style="margin:8px 0 0">${dniDo(lista[0].d)===1?"<strong>Wystaw dziś wieczorem.</strong>":dniDo(lista[0].d)===0?"<strong>Wywóz jest dziś.</strong>":"Wystaw pojemnik wieczorem dzień wcześniej."}</p></div>
    <section class="section"><h2>Kolejne terminy</h2><div class="card terminy">`+
    lista.slice(dzien.length,dzien.length+20).map(r=>`<div class="row"><span class="d">${esc(kiedy(r.d))}</span><span class="ik">${worek(r.rodzaj)}</span><span class="r">${esc(r.rodzaj)}</span></div>`).join("")+
    `</div></section>`;
})();
</script>

</body>
</html>
