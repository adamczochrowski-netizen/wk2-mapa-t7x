<body>
<title>Cmentarz Wirkowice Drugie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Układ: aplikacja na jeden ekran — panel (szukaj + karta grobu) i plan cmentarza w metrach; na telefonie: szukaj u góry, mapa, karta na dole */
:root{
  --bg:#EDF0EB; --panel:#FBFCFA; --fg:#1D2520; --muted:#5B685F; --line:#D2D9D1;
  --grass:#DCE5D6; --gravel:#F4F1E8; --gravel-edge:#CFC8B6; --stone:#97A098; --stone-dark:#6F786F;
  --accent:#B9661A; --accent-soft:#F6E3CC; --on-accent:#FFFFFF; --me:#2860A6; --tree:#B9CBB0;
  --f-display:"Bitter", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131915; --panel:#1A221D; --fg:#E5EAE3; --muted:#9AA79E; --line:#2D3931;
  --grass:#1D2921; --gravel:#363A33; --gravel-edge:#4A4E45; --stone:#6E786F; --stone-dark:#8F998F;
  --accent:#E59A44; --accent-soft:#3D2C19; --on-accent:#1A1208; --me:#69A3EA; --tree:#2A3B2E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131915; --panel:#1A221D; --fg:#E5EAE3; --muted:#9AA79E; --line:#2D3931;
  --grass:#1D2921; --gravel:#363A33; --gravel-edge:#4A4E45; --stone:#6E786F; --stone-dark:#8F998F;
  --accent:#E59A44; --accent-soft:#3D2C19; --on-accent:#1A1208; --me:#69A3EA; --tree:#2A3B2E; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:380px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"top map" "card map"}
.top{grid-area:top;background:var(--panel);border-right:1px solid var(--line);padding-block:18px 12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card{grid-area:card;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding-block:4px 20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;min-width:0}
.map{grid-area:map;position:relative;min-width:0;min-height:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.search{position:relative}
/* Moi bliscy: zapamiętane groby — jedno dotknięcie i prowadzi */
.bliscy{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.bliscy[hidden]{display:none}
.bliscy .lab{width:100%;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bliscy button{font:inherit;font-size:15px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel));color:var(--fg);cursor:pointer}
.bliscy button[aria-current="true"]{background:var(--accent);color:var(--on-accent,#10160F)}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.results{list-style:none;margin:0;padding:0;max-height:38vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.results li button{all:unset;box-sizing:border-box;display:block;width:100%;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.results li:last-child button{border-bottom:0}
.results li button:hover,.results li button:focus-visible{background:var(--accent-soft)}
.results .nm{font-weight:600}
.results .meta,.muted{color:var(--muted);font-size:13px}
.empty-note{padding:10px 12px;color:var(--muted)}

.g-name{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.25;margin:0}
.g-years{color:var(--muted);font-variant-numeric:tabular-nums}
.persons{display:flex;flex-direction:column;gap:6px;margin:10px 0 12px}
.loc{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.loc div{background:var(--panel);padding:8px 10px}
.loc b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.loc span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dist{display:flex;align-items:baseline;gap:8px;margin:4px 0 12px}
.dist b{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.nav{font-weight:700;font-size:16px;margin:-6px 0 12px;color:var(--accent)}
.nav:empty{display:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.arrive{margin:0 0 12px;padding:12px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent)}
.arrive strong{display:block;font-family:var(--f-display);font-size:17px;margin-bottom:2px}
.status{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.status .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status .btn{font-size:13px;padding:7px 10px}
.msg{color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

#svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;background:var(--bg)}
#svg:active{cursor:grabbing}
.ctrls{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.ctrls button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:20px;line-height:1;cursor:pointer}
.walkctl{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.walkctl[hidden]{display:none}
.walkctl button{height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:700 15px/1 var(--f-body,system-ui);white-space:nowrap;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer}
.walkctl .stop{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#10160F)}
.walkctl .stop i{display:inline-block;width:12px;height:12px;border-radius:2px;background:currentColor}
.walkctl button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;max-width:60%}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* SVG */
.fence{fill:var(--grass);stroke:var(--stone-dark);stroke-width:.35}
.alley{stroke:var(--gravel);stroke-linecap:square;fill:none}
.alley-edge{stroke:var(--gravel-edge);stroke-linecap:square;fill:none}
.gap{stroke:var(--gravel);stroke-width:.7;opacity:.8}
.tree{fill:var(--tree)}
.g{fill:var(--stone);stroke:var(--stone-dark);stroke-width:.08;cursor:pointer}
.g:hover{fill:var(--stone-dark)}
.g.empty{fill:none;stroke:var(--stone);stroke-dasharray:.25 .25;cursor:default}
.g.sel{fill:var(--accent);stroke:var(--accent);stroke-width:.4}
.lbl{font-family:var(--f-display);fill:var(--fg);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--grass);stroke-width:.6}
.lbl.big{font-size:4px;opacity:.55;font-weight:700}
.lbl.sm{font-size:1.7px;fill:var(--muted)}
.route{fill:none;stroke:var(--accent);stroke-width:.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1.6 1}
.acc{fill:var(--me);opacity:.15;stroke:var(--me);stroke-width:.12}
.me{fill:var(--me);stroke:var(--panel);stroke-width:.35}
.fala{fill:none;stroke:var(--me);stroke-width:.25;opacity:0}
.znicz-glow{fill:#FFB347;opacity:.28}
.znicz-kubek{fill:#B3261E;stroke:rgba(0,0,0,.35);stroke-width:.08}
.plomien-zew{fill:#FF9A1F}
.plomien-wew{fill:#FFE38A}
.znicz-plomien,.znicz-glow,.fala{transform-box:fill-box;transform-origin:50% 100%}
.znicz-glow,.fala{transform-origin:50% 50%}
@keyframes fala{0%{transform:scale(1);opacity:.7}100%{transform:scale(5);opacity:0}}
@keyframes plomien{0%,100%{transform:scale(1,1) rotate(-2deg)}25%{transform:scale(.92,1.08) rotate(3deg)}50%{transform:scale(1.05,.94) rotate(-1deg)}75%{transform:scale(.96,1.05) rotate(2deg)}}
@keyframes poswiata{0%,100%{opacity:.22;transform:scale(1)}50%{opacity:.36;transform:scale(1.15)}}
@media (prefers-reduced-motion: no-preference){
  .fala{animation:fala 2s ease-out infinite}
  .znicz-plomien{animation:plomien .9s ease-in-out infinite}
  .znicz-glow{animation:poswiata 1.8s ease-in-out infinite}
}
.chapel{fill:var(--panel);stroke:var(--stone-dark);stroke-width:.25}
@media (prefers-reduced-motion: no-preference){ .route{animation:march 1.2s linear infinite} @keyframes march{to{stroke-dashoffset:-2.6}} }

@media (max-width: 760px){
  /* telefon: duża mapa (ok. 2/3 ekranu), karta grobu pod nią — strona przewija się w dół */
  html,body{height:auto}
  body{overflow:auto}
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:auto 66vh auto;grid-template-rows:auto 66svh auto;grid-template-areas:"top" "map" "card"}
  .map{min-height:360px}
  .top,.card{border-right:0;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top{padding-block:10px 8px;gap:6px;border-bottom:1px solid var(--line)}
  .top label{display:none}
  h1{font-size:18px}
  .card{max-height:none;overflow:visible;border-top:1px solid var(--line);padding-block:12px 24px}
  .legend{display:none}
}
</style>

<div class="app">
  <section class="top">
    <div class="eyebrow"><a href="kosciol.html" style="color:inherit;text-decoration:none;font-weight:700">← Kościół</a></div>
    <h1>Cmentarz w Wirkowicach Drugich</h1>
    <div class="search">
      <label for="q" class="muted" style="display:block;margin-bottom:4px">Kogo szukasz?</label>
      <input id="q" type="search" placeholder="Nazwisko, imię albo nr grobu, np. Repeć" autocomplete="off">
    </div>
    <ul class="results" id="results" hidden></ul>
    <div class="bliscy" id="bliscy" hidden role="group" aria-label="Moi bliscy"></div>
  </section>

  <section class="card" id="card" aria-live="polite"></section>

  <section class="map">
    <svg id="svg" role="img" aria-label="Plan cmentarza"></svg>
    <div class="ctrls">
      <button id="zin" aria-label="Przybliż">+</button>
      <button id="zout" aria-label="Oddal">−</button>
      <button id="zfit" aria-label="Pokaż cały cmentarz" style="font-size:15px">⤢</button>
      <button id="zhead" aria-label="Widok na wprost (kierunek marszu w górę)" title="Widok na wprost (kierunek marszu w górę)" style="font-size:18px;font-weight:700">⇧</button>
    </div>
    <div class="walkctl" id="walkctl" hidden>
      <button type="button" class="stop" id="wStop" aria-label="Zatrzymaj symulację"><i aria-hidden="true"></i>Zatrzymaj</button>
      <button type="button" id="wTempo" aria-label="Zmień tempo symulacji">Tempo 1×</button>
    </div>
    <div class="legend">
      <span><i style="background:var(--stone)"></i>grób z wpisanymi osobami</span>
      <span><i style="background:var(--stone);opacity:.32"></i>grób bez danych</span>
      <span><i style="background:var(--me);border-radius:50%"></i>ty (okrąg = niepewność GPS)</span>
      <span><i style="background:var(--accent)"></i>wybrany grób i trasa</span>
    </div>
  </section>
</div>

<style>
.bld{fill:var(--stone-dark);opacity:.7}
.track{fill:none;stroke:var(--gravel-edge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.plaza{fill:var(--gravel);stroke:var(--gravel-edge);stroke-width:.2}
.lbl.big{font-size:6px}
.lbl.sm{font-size:2.4px}
.lbl.note{font-size:2.6px;fill:var(--muted);font-style:italic}
.g.nodata{fill:var(--stone);opacity:.32}
.g.nodata.sel{opacity:1}
</style>

function blockCols(blocks){
  const cols=[], paths=[];
  for(const [a,b,n,lane] of blocks){
    const p = n>1 ? (b-a-COL)/(n-1) : 0;
    for(let i=0;i<n;i++){ const s0=a+i*p;
      cols.push([s0, i===0 ? lane : s0-(p-COL)/2]);        // grób dostępny od ścieżki/przejścia po zachodniej stronie
      if(i<n-1) paths.push(s0+COL+(p-COL)/2); }
  }
  return {cols,paths};
}

function snake(cols,L){
  const out=[];
  cols.forEach((col,i)=>{ const n=col.length;
    const picks=Array.from({length:L},(_,k)=>col[Math.round(k*(n-1)/Math.max(1,L-1))]);
    if(i%2===1) picks.reverse(); out.push(...picks); });
  return out;
}

// ===== Graf alejek i wyznaczanie trasy =====
function buildGraph(segs){
  const nodes=[], adj=[], edges=[], key=new Map();
  const nid=(x,y)=>{const k=x.toFixed(2)+","+y.toFixed(2); if(key.has(k)) return key.get(k);
    const i=nodes.length; nodes.push({x,y}); adj.push([]); key.set(k,i); return i;};
  const pts=segs.map(s=>[[s.x1,s.y1],[s.x2,s.y2]]), e=1e-6;
  segs.forEach((a,i)=>segs.forEach((b,j)=>{
    if(i===j) return;
    if(a.y1===a.y2 && b.x1===b.x2 && b.x1>=a.x1-e && b.x1<=a.x2+e && a.y1>=b.y1-e && a.y1<=b.y2+e){
      pts[i].push([b.x1,a.y1]); pts[j].push([b.x1,a.y1]); }
  }));
  segs.forEach((s,i)=>{
    const hor=s.y1===s.y2, p=pts[i].sort((u,v)=>hor?u[0]-v[0]:u[1]-v[1]);
    let prev=null;
    for(const q of p){ const id=nid(q[0],q[1]);
      if(prev!==null && prev!==id){ const d=Math.hypot(nodes[prev].x-nodes[id].x,nodes[prev].y-nodes[id].y);
        adj[prev].push([id,d]); adj[id].push([prev,d]); edges.push([prev,id]); }
      prev=id; }
  });
  return {nodes,adj,edges};
}
const G=buildGraph(segs);
const dst=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
function project(p){
  let best=null;
  for(const [a,b] of G.edges){ const A=G.nodes[a],B=G.nodes[b], dx=B.x-A.x, dy=B.y-A.y, L2=dx*dx+dy*dy;
    let t=L2?((p.x-A.x)*dx+(p.y-A.y)*dy)/L2:0; t=Math.max(0,Math.min(1,t));
    const q={x:A.x+t*dx,y:A.y+t*dy}, d=dst(p,q);
    if(!best||d<best.d) best={a,b,q,d}; }
  return best;
}
function route(from,to){
  const s=project(from), e=project(to), S=-1, E=-2;
  const same=(s.a===e.a&&s.b===e.b)||(s.a===e.b&&s.b===e.a);
  const pos=n=>n===S?s.q:n===E?e.q:G.nodes[n];
  const nb=n=>{
    if(n===S){ const r=[[s.a,dst(s.q,G.nodes[s.a])],[s.b,dst(s.q,G.nodes[s.b])]]; if(same) r.push([E,dst(s.q,e.q)]); return r; }
    const r=G.adj[n].slice(); if(n===e.a||n===e.b) r.push([E,dst(G.nodes[n],e.q)]); return r; };
  const dist=new Map([[S,0]]), prev=new Map(), done=new Set();
  for(;;){ let u=null,ud=Infinity; for(const [k,v] of dist) if(!done.has(k)&&v<ud){u=k;ud=v;}
    if(u===null||u===E) break; done.add(u);
    for(const [v,w] of nb(u)){ const nd=ud+w; if(nd<(dist.has(v)?dist.get(v):Infinity)){dist.set(v,nd);prev.set(v,u);} } }
  if(!dist.has(E)) return null;
  const ids=[]; for(let c=E;c!==undefined;c=prev.get(c)) ids.unshift(c);
  const raw=[from,...ids.map(pos),to], pts=[];
  for(const p of raw) if(!pts.length||dst(pts[pts.length-1],p)>0.05) pts.push({x:p.x,y:p.y});
  let len=0; for(let i=1;i<pts.length;i++) len+=dst(pts[i-1],pts[i]);
  return {pts,len};
}

  // podpisy (bez obrotu, żeby dało się czytać)
  for(const B of BLOCKS){ const gs=graves.filter(g=>g.block===B.code); if(!gs.length) continue;
    const s=gs.reduce((a,g)=>a+g.x+g.w/2,0)/gs.length, t=Math.min(...gs.map(g=>g.y))-1.2;
    label(s, t, B.code, "sm"); }
  label(50,111.5,"kwatery wg mapy cmentarza, groby orientacyjnie","note");
  label(45,-6,"BRAMA","sm"); label(36.8,51.5,"kaplica","sm");
  label(8,62,"wolny teren","note"); label(8,66,"(bez grobów)","note");
  // Krzyż na kaplicy rysowany poza planem i obracany odwrotnie do mapy, jak podpisy: zawsze stoi prosto.
  { const w=L2W(36.75,41.25);
    const n=el("path",{d:`M${w.x} ${w.y-1.45}V${w.y+1.5}M${w.x-1.05} ${w.y-0.55}H${w.x+1.05}`,
      stroke:"var(--stone-dark)","stroke-width":.35,"stroke-linecap":"round",fill:"none"},camG);
    labelsArr.push({n,x:w.x,y:w.y}); }
}

// ===== Stan =====
// Tryby pozycji: "none" (na start — trzeba włączyć GPS), "gps", "manual" (ustawiona ręcznie, z symulacją trasy)
const state={ me:{...START}, acc:4, mode:"none", gpsOK:false, sel:null, route:null, walk:null, arrived:false, gpsMsg:"", watch:null };
const hasPos=()=>state.mode==="manual"||(state.mode==="gps"&&state.gpsOK);
// Elementy ruchome tworzone raz i tylko przesuwane — dzięki temu animacje (puls, płomień) nie restartują się
let DYN=null;
function dynInit(){
  DYN={};
  DYN.route=el("polyline",{class:"route",points:""},dyn);
  // znicz przy wybranym grobie: poświata, szklany kubek, migający płomień
  DYN.znicz=el("g",{class:"znicz"},dyn);
  el("circle",{r:1.6,class:"znicz-glow"},DYN.znicz);
  el("rect",{x:-.42,y:-.55,width:.84,height:1.0,rx:.15,class:"znicz-kubek"},DYN.znicz);
  const pl=el("g",{class:"znicz-plomien"},DYN.znicz);
  el("path",{d:"M0 -1.75 C .38 -1.25 .32 -.85 0 -.62 C -.32 -.85 -.38 -1.25 0 -1.75Z",class:"plomien-zew"},pl);
  el("path",{d:"M0 -1.4 C .18 -1.1 .15 -.9 0 -.78 C -.15 -.9 -.18 -1.1 0 -1.4Z",class:"plomien-wew"},pl);
  // ty: okrąg niepewności, rozchodząca się fala i kropka
  DYN.me=el("g",{class:"ja"},dyn);
  DYN.acc=el("circle",{r:4,class:"acc"},DYN.me);
  DYN.fala=el("circle",{r:1,class:"fala"},DYN.me);
  el("circle",{r:1,class:"me"},DYN.me);
}
function drawDynamic(){
  if(!DYN) dynInit();
  document.querySelectorAll(".g.sel").forEach(n=>n.classList.remove("sel"));
  if(state.sel){ const n=svg.querySelector(`[data-g="${state.sel.id}"]`); if(n) n.classList.add("sel"); }
  const r=currentRoutePts();
  DYN.route.setAttribute("points", r&&r.length>1 ? r.map(p=>`${p.x},${p.y}`).join(" ") : "");
  if(state.sel){
    // znicz stoi na grobie, zawsze pionowo (przeciwnie do obrotu mapy w trybie „na wprost”)
    const gx=state.sel.x+state.sel.w/2, gy=state.sel.y+state.sel.h/2, a=-(PLAN_ROT+(cam.on?cam.ang:0));
    DYN.znicz.setAttribute("transform",`translate(${gx} ${gy}) rotate(${a})`); DYN.znicz.style.display="";
  } else DYN.znicz.style.display="none";
  if(hasPos()){
    DYN.me.setAttribute("transform",`translate(${state.me.x} ${state.me.y})`);
    DYN.acc.setAttribute("r",Math.max(1,state.acc)); DYN.me.style.display="";
  } else DYN.me.style.display="none";
  camUpdate(!!state.walk);
  const nv=document.getElementById("nav"); if(nv) nv.textContent=navText();
}

// ===== Widok „na wprost”: mapa obrócona tak, że kierunek marszu jest w górę ekranu =====
const cam={on:false, ang:0, w:34};   // w = szerokość widoku w metrach
function headingTarget(){
  const pts=currentRoutePts(); if(!pts||pts.length<2) return null;
  for(let i=1;i<pts.length;i++) if(dst(pts[i],state.me)>0.4){
    const a=L2W(state.me.x,state.me.y), b=L2W(pts[i].x,pts[i].y);
    return -90-Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI; }
  return null;
}
function camUpdate(smooth){
  if(!cam.on||!camG) return;
  // GPS + kompas: góra ekranu = kierunek, w który patrzysz. Symulacja: góra ekranu = kierunek trasy.
  const tgt = (state.mode==="gps"&&typeof state.compass==="number"&&GEO) ? -GEO.rotDeg-state.compass : headingTarget();
  if(tgt!==null){ const d=((tgt-cam.ang)%360+540)%360-180; cam.ang+= smooth? d*0.12 : d; }
  const m=L2W(state.me.x,state.me.y), r=svg.getBoundingClientRect(), h=cam.w*(r.height/Math.max(1,r.width));
  camG.setAttribute("transform",`rotate(${cam.ang} ${m.x} ${m.y})`);
  for(const L of labelsArr) L.n.setAttribute("transform",`rotate(${-cam.ang} ${L.x} ${L.y})`);
  vb={x:m.x-cam.w/2, y:m.y-h*0.68, w:cam.w, h}; setVB();   // ty w dolnej części ekranu, więcej widać przed tobą
}
function camSet(on){
  cam.on=on;
  if(!on){ camG.removeAttribute("transform"); labelsArr.forEach(L=>L.n.removeAttribute("transform")); }
  else camUpdate(false);
  const b=document.getElementById("zhead");
  if(b){ b.textContent=on?"N":"⇧"; b.setAttribute("aria-label",on?"Widok z północą u góry":"Widok na wprost (kierunek marszu w górę)"); b.title=b.getAttribute("aria-label"); }
}

// ===== Podpowiedzi: gdzie skręcić i po której stronie jest grób =====
const turnAngle=(a,b,c)=>{ const v1={x:b.x-a.x,y:b.y-a.y}, v2={x:c.x-b.x,y:c.y-b.y};
  return Math.atan2(v1.x*v2.y-v1.y*v2.x, v1.x*v2.x+v1.y*v2.y)*180/Math.PI; };   // >0 = w prawo
function graveSide(a,b){
  const g=state.sel; if(!g) return "";
  const v={x:b.x-a.x,y:b.y-a.y}, u={x:g.x+g.w/2-b.x,y:g.y+g.h/2-b.y}, cr=v.x*u.y-v.y*u.x;
  return Math.abs(cr)<1e-6 ? "" : (cr>0?"prawej":"lewej");
}
function navText(){
  if(!state.sel||state.arrived) return "";
  const pts=currentRoutePts(); if(!pts||pts.length<2) return "";
  const Q=[state.me, ...pts.slice(1).filter(p=>dst(p,state.me)>0.4)];
  if(Q.length<2) return "";
  let dist=0;
  for(let k=1;k<Q.length;k++){
    dist+=dst(Q[k-1],Q[k]);
    if(k===Q.length-1){ const side=graveSide(Q[k-1],Q[k]);
      return `Idź prosto ${Math.round(dist)} m${side?`, grób będzie po ${side} stronie`:""}.`; }
    const ang=turnAngle(Q[k-1],Q[k],Q[k+1]);
    if(Math.abs(ang)>=25){ const turn=ang>0?"skręć w prawo":"skręć w lewo";
      return dist<2 ? `Teraz ${turn}.` : `Za ${Math.round(dist)} m ${turn}.`; }
  }
  return "";
}
function currentRoutePts(){ if(!state.route) return null; if(!state.walk) return state.route.pts; return [state.me,...state.route.pts.slice(state.walk.seg+1)]; }
function remaining(){ if(!state.route) return 0; if(!state.walk) return state.route.len; return Math.max(0,state.route.len-state.walk.s); }
function recompute(){
  state.route=state.sel&&hasPos()?route(state.me,{x:state.sel.ax,y:state.sel.ay}):null;
  state.arrived=!!(state.sel&&hasPos()&&dst(state.me,{x:state.sel.ax,y:state.sel.ay})<3);
}

// ===== Karta =====
const card=document.getElementById("card");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const secName=id=>SECTIONS.find(s=>s.id===id).name;
function renderCard(){
  let h=""; const g=state.sel;
  if(!g){
    h+=`<p class="g-name" style="font-size:17px;margin-top:10px">Kogo odwiedzasz?</p>
        <p class="muted">Wpisz nazwisko w wyszukiwarce albo dotknij grobu na mapie. Aplikacja pokaże trasę alejkami od miejsca, w którym jesteś.</p>`;
  } else {
    h+= g.persons.length
      ? `<div class="persons">`+g.persons.map(p=>`<div><p class="g-name">${esc(p.first)} ${esc(p.last)}</p><div class="g-years">${esc(lifeLine(p))}</div></div>`).join("")+`</div>`
      : `<p class="g-name" style="font-size:17px;margin:10px 0 4px">${g.code?"Grób "+g.code:"Grób bez danych"}</p><p class="muted" style="margin:0 0 10px">${g.code?"Na przepisanej liście nie ma jeszcze osób z tego grobu.":"Dla tej części cmentarza nie wpisaliśmy jeszcze listy osób."}</p>`;
    if(g.code){ const [sek,kw,nr]=g.code.split("/");
      h+=`<div class="loc"><div><span>Sektor</span><b>${sek}</b></div><div><span>Kwatera</span><b>${kw}</b></div><div><span>Grób nr</span><b>${nr}</b></div></div>`;
      h+=`<p class="muted" style="margin:-4px 0 10px">Kwatera ${g.block} stoi na planie we właściwej części cmentarza, a miejsce grobu w niej jest orientacyjne.</p>`; }
    if(state.arrived){
      h+=`<div class="arrive"><strong>Jesteś na miejscu</strong>${state.arriveSide?`Grób jest po ${state.arriveSide} stronie ścieżki. `:""}${g.code?"Szukaj grobu nr "+g.nr+" w kwaterze "+g.block+".":"Grób stoi przy tej alejce."} GPS potrafi się mylić o kilka metrów, więc ostatni kawałek sprawdź po napisie na nagrobku.</div>`;
    } else if(state.route){
      h+=`<div class="dist"><b>${Math.round(remaining())} m</b><span class="muted">${state.walk?"zostało do grobu":"pieszo alejkami"}</span></div>`;
      h+=`<div class="nav" id="nav">${esc(navText())}</div>`;
    } else if(!hasPos()){
      h+=`<p style="margin:0 0 10px;font-weight:600">${state.mode==="gps"?"Czekam na twoją pozycję na cmentarzu…":"Włącz GPS, a poprowadzę cię alejkami do tego grobu."}</p>`;
    }
    h+=`<div class="btns">`;
    if(state.mode==="none") h+=`<button class="btn primary" id="bGps2">Włącz GPS</button>`;
    if(state.mode==="manual"&&!state.arrived) h+=state.walk?`<button class="btn primary" id="bStop">Zatrzymaj</button>`:`<button class="btn primary" id="bWalk">Symuluj trasę</button>`;
    if(state.arrived&&state.mode==="manual") h+=`<button class="btn primary" id="bReset">Wróć do bramy</button>`;
    h+=`<button class="btn" id="bBliski" aria-pressed="${jestBliski(g)}">${jestBliski(g)?"★ W moich bliskich":"☆ Dodaj do moich bliskich"}</button>`;
    if(g.code) h+=`<button class="btn" id="bShare">Udostępnij</button>`;
    h+=`<button class="btn" id="bClear">Wyczyść</button></div>`;
    if(state.shareMsg) h+=`<p class="muted" style="margin:8px 0 0">${state.shareMsg}</p>`;
  }
  const pill = state.mode==="gps" ? (state.gpsOK?"GPS ±"+Math.round(state.acc)+" m":"GPS: szukam…") : state.mode==="manual" ? "ustawiona ręcznie" : "nieznana";
  h+=`<div class="status">
      <div class="row">Twoja pozycja: <span class="pill">${pill}</span></div>
      ${state.gpsMsg?`<div class="msg">${esc(state.gpsMsg)}</div>`:""}
      <div class="row">
        ${state.mode!=="gps"&&!(state.mode==="none"&&state.sel)?`<button class="btn${state.mode==="none"?" primary":""}" id="bGps">Włącz GPS</button>`:""}
        ${state.mode!=="manual"?`<button class="btn" id="bManual">Ustaw lokalizację ręcznie</button>`:""}
      </div>
      ${state.mode==="manual"?`<div>Dotknij mapy w miejscu, w którym stoisz. „Symuluj trasę” pokaże, jak dojść do grobu.</div>`:""}
      <div>Układ alejek odrysowany ze zdjęcia z drona, wymiary są szacunkowe. Wpisane są kwatery A/I, A/II, B/III i B/IV, przepisane z listy cmentarza. To pokaz działania, nie oficjalna ewidencja.</div>
    </div>`;
  card.innerHTML=h;
  const on=(id,fn)=>{const b=document.getElementById(id); if(b) b.onclick=fn;};
  on("bWalk",startWalk); on("bStop",()=>stopWalk()); on("bClear",()=>select(null));
  on("bBliski",()=>{ przelaczBliskiego(state.sel); renderCard(); });
  on("bShare",shareGrave);
  on("bReset",()=>{state.me={...START}; state.arriveSide=""; camSet(false); vb={...FIT}; setVB(); recompute(); update();});
  on("bGps",startGps); on("bGps2",startGps); on("bManual",startManual);
}
function update(){ drawDynamic(); renderCard(); }
// ===== Moi bliscy: groby zapamiętane w tym telefonie (lista id grobów) =====
const BL_KLUCZ="wirk-bliscy";
const bliscy=()=>{ try{ const v=JSON.parse(localStorage.getItem(BL_KLUCZ)||"[]"); return Array.isArray(v)?v.filter(id=>byId.has(id)):[]; }catch(e){ return []; } };
const jestBliski=g=>!!g&&bliscy().includes(g.id);
function przelaczBliskiego(g){ if(!g) return; let l=bliscy();
  l=l.includes(g.id)?l.filter(x=>x!==g.id):[...l,g.id];
  try{ localStorage.setItem(BL_KLUCZ,JSON.stringify(l)); }catch(e){}
  rysujBliskich(); }
const opisGrobu=g=>g.persons.length?g.persons.map(p=>`${p.first} ${p.last}`).join(", "):(g.code?"Grób "+g.code:"Grób bez danych");
function rysujBliskich(){
  const el=document.getElementById("bliscy"), l=bliscy().map(id=>byId.get(id));
  el.hidden=!l.length;
  el.innerHTML=l.length?`<span class="lab">★ Moi bliscy</span>`+l.map(g=>`<button type="button" data-bl="${g.id}" aria-current="${String(state.sel===g)}">${esc(opisGrobu(g))}</button>`).join(""):"";
}
document.getElementById("bliscy").addEventListener("click",e=>{ const b=e.target.closest("[data-bl]"); if(!b) return; const g=byId.get(b.dataset.bl); if(g){ select(g); rysujBliskich(); } });
function select(g){ stopWalk(true); state.sel=g; state.arriveSide=""; state.shareMsg="";
  if(!g&&cam.on){ camSet(false); vb={...FIT}; setVB(); }
  recompute(); update(); if(g&&!cam.on) ensureVisible(g); if(typeof rysujBliskich==="function") rysujBliskich(); }

// ===== Symulacja spaceru =====
let raf=null;
let TEMPO=(()=>{ try{ const v=+localStorage.getItem("wirk-tempo"); return [1,2,4].includes(v)?v:2; }catch(e){ return 2; } })();
// przyciski na samej mapie: Zatrzymaj i Tempo — widoczne tylko w czasie symulacji
function walkUI(){ const box=document.getElementById("walkctl"); if(!box) return;
  box.hidden=!state.walk; document.getElementById("wTempo").textContent="Tempo "+TEMPO+"×"; }
document.getElementById("wStop").addEventListener("click",()=>stopWalk());
document.getElementById("wTempo").addEventListener("click",()=>{ TEMPO=TEMPO===1?2:TEMPO===2?4:1; try{ localStorage.setItem("wirk-tempo",TEMPO); }catch(e){} walkUI(); });
function startWalk(){
  if(!state.route) return;
  state.walk={s:0,seg:0,last:performance.now()}; state.arriveSide="";
  if(!cam.on) camSet(true);   // w czasie dojścia mapa obraca się w kierunku marszu
  const pts=state.route.pts, cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+dst(pts[i-1],pts[i]));
  // tempo spaceru: 1× = zwykły krok (ok. 1,3 m/s); przycisk na mapie przełącza 1× / 2× / 4×
  const step=t=>{
    const w=state.walk; if(!w) return;
    w.s+=1.3*TEMPO*Math.min(.1,(t-w.last)/1000); w.last=t;
    if(w.s>=state.route.len){ state.arriveSide=pts.length>1?graveSide(pts[pts.length-2],pts[pts.length-1]):"";
      state.me={...pts[pts.length-1]}; state.walk=null; state.arrived=true; state.route=route(state.me,{x:state.sel.ax,y:state.sel.ay}); update(); walkUI(); return; }
    while(w.seg<pts.length-2&&cum[w.seg+1]<w.s) w.seg++;
    const a=pts[w.seg], b=pts[w.seg+1], f=(w.s-cum[w.seg])/(cum[w.seg+1]-cum[w.seg]||1);
    state.me={x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f};
    drawDynamic();
    const d=card.querySelector(".dist b"); if(d) d.textContent=Math.round(remaining())+" m";
    raf=requestAnimationFrame(step);
  };
  renderCard(); walkUI(); raf=requestAnimationFrame(step);
  // na telefonie mapa jest nad kartą — przewijamy, żeby plan cmentarza z trasą był na środku ekranu
  // (chwilę później — po przerysowaniu karty, które samo potrafi przewinąć ekran)
  // (własna animacja krok po kroku — wbudowane „smooth” przerywa się, bo mapa rysuje się w każdej klatce)
  setTimeout(()=>{ const m=document.querySelector(".map"); if(!m) return; const r=m.getBoundingClientRect();
    const y0=scrollY, y1=Math.max(0,scrollY+r.top-Math.max(0,(innerHeight-r.height)/2));
    if(Math.abs(y1-y0)<4) return;
    if(matchMedia("(prefers-reduced-motion: reduce)").matches){ window.scrollTo(0,y1); return; }
    const t0=performance.now(), T=420, ease=x=>1-Math.pow(1-x,3);
    const krok=t=>{ const f=Math.min(1,(t-t0)/T); window.scrollTo(0,y0+(y1-y0)*ease(f)); if(f<1) requestAnimationFrame(krok); };
    requestAnimationFrame(krok); },60);
}
function stopWalk(silent){
  if(raf) cancelAnimationFrame(raf); raf=null;
  setTimeout(walkUI,0);
  if(state.walk){ state.walk=null; recompute(); if(!silent) update(); }
}

// ===== Prawdziwy GPS =====
// Przekształcenie podobieństwa (przesunięcie + obrót + skala) z dwóch punktów, na liczbach zespolonych:
// z_planu = a·z_gps + b, gdzie z = x (wschód) + i·y (południe), w metrach.
const Cx={ sub:(u,v)=>({re:u.re-v.re,im:u.im-v.im}), add:(u,v)=>({re:u.re+v.re,im:u.im+v.im}),
  mul:(u,v)=>({re:u.re*v.re-u.im*v.im,im:u.re*v.im+u.im*v.re}),
  div:(u,v)=>{const d=v.re*v.re+v.im*v.im; return {re:(u.re*v.re+u.im*v.im)/d,im:(u.im*v.re-u.re*v.im)/d};} };
const hasCoords=c=>typeof c.lat==="number"&&typeof c.lon==="number";
const calibOK = hasCoords(CALIB[0]);              // brama wystarczy; kaplica tylko poprawia obrót i skalę
let GEO=null;
if(calibOK){
  const lat0=CALIB[0].lat, lon0=CALIB[0].lon, k=Math.cos(lat0*Math.PI/180);
  const enu=(lat,lon)=>({re:(lon-lon0)*k*111320, im:-(lat-lat0)*110540});   // metry: x = wschód, y = południe
  const pts=CALIB.filter(hasCoords);
  const q=pts.map(c=>enu(c.lat,c.lon)), p=pts.map(c=>{const w=L2W(c.local.x,c.local.y); return {re:w.x,im:w.y};});
  const a = pts.length>1 ? Cx.div(Cx.sub(p[1],p[0]),Cx.sub(q[1],q[0])) : {re:1,im:0};   // jeden punkt: plan północą do góry, skala 1:1
  const b=Cx.sub(p[0],Cx.mul(a,q[0]));
  GEO={enu,a,b, points:pts.length, scale:Math.hypot(a.re,a.im), rotDeg:Math.atan2(a.im,a.re)*180/Math.PI};
  if(Math.abs(GEO.scale-1)>0.2) console.warn("Kalibracja GPS: skala",GEO.scale.toFixed(2),"— sprawdź współrzędne punktów");
}
function geoToLocal(lat,lon){
  const z=Cx.add(Cx.mul(GEO.a,GEO.enu(lat,lon)),GEO.b);
  return W2L(z.re,z.im);
}

// ===== Kompas telefonu: w trybie GPS mapa obraca się tak, jak trzymasz telefon =====
let compassOn=false;
function onOrient(e){
  let h=null;
  if(typeof e.webkitCompassHeading==="number") h=e.webkitCompassHeading;          // iPhone
  else if(e.absolute&&typeof e.alpha==="number") h=(360-e.alpha)%360;             // Android
  if(h===null) return;
  const so=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
  state.compass=(h+so+360)%360;
  if(cam.on&&state.mode==="gps") camUpdate(true);
}
async function startCompass(){
  if(compassOn) return;
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      const r=await DeviceOrientationEvent.requestPermission(); if(r!=="granted") return;   // iPhone pyta o zgodę
    }
    window.addEventListener("deviceorientationabsolute",onOrient,true);
    window.addEventListener("deviceorientation",onOrient,true);
    compassOn=true;
  }catch(e){}
}
function startGps(){
  stopWalk(true);
  if(!calibOK){ state.gpsMsg="GPS nie jest jeszcze skalibrowany: brakuje współrzędnych bramy. Ustaw lokalizację ręcznie."; renderCard(); return; }
  if(!("geolocation" in navigator)){ state.gpsMsg="Ta przeglądarka nie udostępnia lokalizacji. Ustaw lokalizację ręcznie."; renderCard(); return; }
  startCompass();   // wywołane z kliknięcia, więc iPhone może zapytać o kompas
  if(state.watch!==null){ try{navigator.geolocation.clearWatch(state.watch);}catch(e){} state.watch=null; }
  state.mode="gps"; state.gpsOK=false; state.gpsMsg="Czekam na sygnał GPS…"; recompute(); update();
  try{
    state.watch=navigator.geolocation.watchPosition(pos=>{
      const p=geoToLocal(pos.coords.latitude,pos.coords.longitude), far=Math.hypot(p.x-45,p.y-55);
      state.mode="gps"; state.acc=pos.coords.accuracy||8;
      if(far>400){ state.gpsOK=false; state.gpsMsg=`Jesteś ok. ${(far/1000).toFixed(1)} km od cmentarza. Trasa pojawi się, gdy będziesz na miejscu.`; recompute(); update(); return; }
      const first=!state.gpsOK;
      state.gpsOK=true; state.gpsMsg=""; state.me=p; recompute();
      if(first&&state.sel&&!cam.on) camSet(true);   // pierwsza pozycja na cmentarzu: od razu widok na wprost
      update();
    }, err=>{
      state.gpsMsg=err.code===1
        ? "Lokalizacja jest zablokowana. Zezwól tej stronie na dostęp do lokalizacji (ikona kłódki przy adresie) i spróbuj ponownie. W podglądzie na claude.ai GPS nie działa."
        : "Nie udało się ustalić pozycji. Wyjdź na otwartą przestrzeń i spróbuj ponownie.";
      stopGps(true); renderCard();
    }, {enableHighAccuracy:true, maximumAge:2000, timeout:20000});
  }catch(e){ state.gpsMsg="Lokalizacja jest niedostępna w tym podglądzie."; renderCard(); }
}
function stopGps(keepMsg){
  if(state.watch!==null){ try{navigator.geolocation.clearWatch(state.watch);}catch(e){} state.watch=null; }
  state.compass=null; state.gpsOK=false;
  state.mode="none"; state.acc=4;
  if(keepMsg!==true) state.gpsMsg="";
  recompute(); update();
}
// Ręczne ustawienie pozycji (np. gdy GPS nie działa albo do pokazania trasy w domu): start przy bramie
function startManual(){
  stopWalk(true);
  if(state.watch!==null){ try{navigator.geolocation.clearWatch(state.watch);}catch(e){} state.watch=null; }
  state.compass=null; state.gpsOK=false; state.gpsMsg="";
  state.mode="manual"; state.acc=4; state.me={...START};
  recompute(); update();
}

// ===== Wyszukiwarka =====
const norm=s=>s.toLowerCase().replace(/ł/g,"l").normalize("NFD").replace(/[̀-ͯ]/g,"");
const index=[]; for(const g of graves) for(const p of g.persons) index.push({g,p,key:norm(p.first+" "+p.last+" "+g.code)});
const q=document.getElementById("q"), res=document.getElementById("results");
q.addEventListener("input",()=>{
  const v=norm(q.value.trim());
  if(v.length<2){ res.hidden=true; return; }
  const parts=v.split(/\s+/);
  const hits=index.filter(it=>parts.every(pt=>it.key.includes(pt))).sort((a,b)=>a.p.last.localeCompare(b.p.last,"pl")||a.p.first.localeCompare(b.p.first,"pl")).slice(0,40);
  res.innerHTML=hits.length?hits.map((it,i)=>`<li><button data-i="${i}"><div class="nm">${esc(it.p.first)} ${esc(it.p.last)}</div><div class="meta">grób ${esc(it.g.code)} · ${esc(lifeLine(it.p))}</div></button></li>`).join("")
    :`<li class="empty-note">Nikogo takiego nie ma jeszcze na wpisanej liście. Wpisane są kwatery A/I, A/II, B/III i B/IV.</li>`;
  res.hidden=false;
  res.querySelectorAll("button").forEach(b=>b.onclick=()=>{ select(hits[+b.dataset.i].g); res.hidden=true; q.blur(); });
});

// ===== Przesuwanie i przybliżanie mapy =====
// Widok „cały cmentarz”: prostokąt ciasno wokół ogrodzenia i bramy (z małym marginesem), żeby plan wypełniał mapę
const FIT=(()=>{ const pts=[[-3,-8],[96,6],[96,99],[87.5,111.2],[-3,111.2]].map(([s,t])=>L2W(s,t));
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y), m=3;
  const x0=Math.min(...xs)-m, y0=Math.min(...ys)-m; return {x:x0, y:y0, w:Math.max(...xs)+m-x0, h:Math.max(...ys)+m-y0}; })();
let vb={...FIT};
const setVB=()=>svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
const toSvg=(cx,cy)=>{const p=svg.createSVGPoint(); p.x=cx; p.y=cy; return p.matrixTransform(svg.getScreenCTM().inverse());};
const toLocal=(cx,cy)=>{const p=svg.createSVGPoint(); p.x=cx; p.y=cy; return p.matrixTransform(plan.getScreenCTM().inverse());};
function zoomAt(pt,f){ const nw=Math.min(220,Math.max(10,vb.w/f)); f=vb.w/nw;
  vb={x:pt.x-(pt.x-vb.x)/f, y:pt.y-(pt.y-vb.y)/f, w:vb.w/f, h:vb.h/f}; setVB(); }
function ensureVisible(g){ const w=L2W(g.ax,g.ay); if(w.x<vb.x||w.x>vb.x+vb.w||w.y<vb.y||w.y>vb.y+vb.h){ vb={...FIT}; setVB(); } }
const ptrs=new Map(); let downAt=null, moved=0;
svg.addEventListener("pointerdown",e=>{ svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ downAt={target:e.target}; moved=0; } else moved=99; });
svg.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)) return;
  const prev=ptrs.get(e.pointerId), cur={x:e.clientX,y:e.clientY};
  if(ptrs.size===1){
    moved+=Math.hypot(cur.x-prev.x,cur.y-prev.y);
    if(moved>6){ if(cam.on&&!state.walk) camSet(false);
      if(!cam.on){ const a=toSvg(prev.x,prev.y), b=toSvg(cur.x,cur.y); vb.x-=b.x-a.x; vb.y-=b.y-a.y; setVB(); } }
  } else if(ptrs.size===2&&cam.on){
    const other=[...ptrs.entries()].find(([k])=>k!==e.pointerId)[1];
    const pd=Math.hypot(prev.x-other.x,prev.y-other.y), cd=Math.hypot(cur.x-other.x,cur.y-other.y);
    if(pd>0){ cam.w=Math.min(120,Math.max(12,cam.w*pd/cd)); camUpdate(false); }
  } else if(ptrs.size===2){
    const other=[...ptrs.entries()].find(([k])=>k!==e.pointerId)[1];
    const pm={x:(prev.x+other.x)/2,y:(prev.y+other.y)/2}, cm={x:(cur.x+other.x)/2,y:(cur.y+other.y)/2};
    const pd=Math.hypot(prev.x-other.x,prev.y-other.y), cd=Math.hypot(cur.x-other.x,cur.y-other.y);
    if(pd>0) zoomAt(toSvg(pm.x,pm.y),cd/pd);
    const a=toSvg(pm.x,pm.y), b=toSvg(cm.x,cm.y); vb.x-=b.x-a.x; vb.y-=b.y-a.y; setVB();
  }
  ptrs.set(e.pointerId,cur);
});
svg.addEventListener("pointerup",e=>{
  const was=ptrs.size; ptrs.delete(e.pointerId);
  if(was===1&&downAt&&moved<=6){
    const gEl=downAt.target.closest&&downAt.target.closest("[data-g]"), g=gEl&&byId.get(gEl.dataset.g);
    if(g) select(g);
    else if(state.mode==="manual"){
      const p=toLocal(e.clientX,e.clientY); stopWalk(true);
      state.me={x:Math.max(-6,Math.min(99,p.x)), y:Math.max(-8,Math.min(113,p.y))};
      recompute(); update();
    }
  }
  if(ptrs.size===0) downAt=null;
});
svg.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);downAt=null;});
const camZoom=f=>{ cam.w=Math.min(120,Math.max(12,cam.w/f)); camUpdate(false); };
svg.addEventListener("wheel",e=>{ e.preventDefault(); const f=Math.exp(-e.deltaY*0.0015);
  if(cam.on) camZoom(f); else zoomAt(toSvg(e.clientX,e.clientY),f); },{passive:false});
document.getElementById("zin").onclick=()=>cam.on?camZoom(1.5):zoomAt({x:vb.x+vb.w/2,y:vb.y+vb.h/2},1.5);
document.getElementById("zout").onclick=()=>cam.on?camZoom(1/1.5):zoomAt({x:vb.x+vb.w/2,y:vb.y+vb.h/2},1/1.5);
document.getElementById("zfit").onclick=()=>{ if(cam.on) camSet(false); vb={...FIT}; setVB(); };
document.getElementById("zhead").onclick=()=>{ if(cam.on){ camSet(false); vb={...FIT}; setVB(); } else camSet(true); };

// ===== Start: przykładowy grób już wybrany =====
setVB(); drawStatic();
// ===== Udostępnianie grobu: link z kodem grobu po #, np. cmentarz.html#A-II-305 =====
const codeToHash=c=>c.replace(/\//g,"-");
const hashToGrave=()=>{ const h=decodeURIComponent(location.hash.slice(1)); if(!/^[AB]-[IV]+-\d+$/.test(h)) return null;
  return byCode.get(h.replace(/-/g,"/"))||null; };
async function shareGrave(){
  const g=state.sel; if(!g||!g.code) return;
  const url=location.href.split("#")[0]+"#"+codeToHash(g.code);
  const who=g.persons.map(p=>`${p.first} ${p.last}`).join(", ");
  const text=`${who?who+" — ":""}grób ${g.code} na cmentarzu w Wirkowicach Drugich. Mapa z prowadzeniem do grobu:`;
  try{ if(navigator.share){ await navigator.share({title:"Grób "+g.code,text,url}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(text+" "+url); state.shareMsg="Skopiowano link. Wklej go w SMS-ie albo komunikatorze."; }
  catch(e){ state.shareMsg="Link do tego grobu: <span style=\"user-select:all;word-break:break-all\">"+esc(url)+"</span>"; }
  renderCard();
}
window.addEventListener("hashchange",()=>{ const g=hashToGrave(); if(g) select(g); });

state.sel=hashToGrave()||(bliscy().length?byId.get(bliscy()[0]):null)||byCode.get("B/IV/97")||graves.find(g=>g.persons.length);
rysujBliskich();
recompute(); update();
</script>
