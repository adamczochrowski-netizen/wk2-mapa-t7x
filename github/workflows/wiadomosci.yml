# Moje Wirkowice — co 30 minut pobiera nagłówki (Polska i Świat) z RSS i zapisuje wiadomosci.json obok aplikacji.
# Telefony czytają ten plik z tego samego adresu co aplikacja, więc nie trzeba żadnego serwera.
# W repozytorium ten plik leży w: .github/workflows/wiadomosci.yml
name: Wiadomości
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: wiadomosci
  cancel-in-progress: false
jobs:
  pobierz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz nagłówki
        shell: python
        run: |
          import json, urllib.request, xml.etree.ElementTree as ET, datetime, email.utils
          ZRODLA = {
            "polska": [("RMF24", "https://www.rmf24.pl/fakty/polska/feed"), ("Polsat News", "https://www.polsatnews.pl/rss/polska.xml")],
            "swiat":  [("RMF24", "https://www.rmf24.pl/fakty/swiat/feed"),  ("Polsat News", "https://www.polsatnews.pl/rss/swiat.xml")],
          }
          def pobierz(url):
              req = urllib.request.Request(url, headers={"User-Agent": "MojeWirkowice/1.0 (+https://adamczochrowski-netizen.github.io/wk2-mapa-t7x/)"})
              return ET.fromstring(urllib.request.urlopen(req, timeout=30).read())
          wynik = {"zaktualizowano": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")}
          for dzial, lista in ZRODLA.items():
              wpisy, tytuly = [], set()
              for zrodlo, url in lista:
                  try:
                      for it in pobierz(url).iter("item"):
                          t = (it.findtext("title") or "").strip(); l = (it.findtext("link") or "").strip()
                          if not t or not l.startswith("https://") or t.lower() in tytuly: continue
                          try: d = email.utils.parsedate_to_datetime(it.findtext("pubDate")).astimezone(datetime.timezone.utc)
                          except Exception: continue
                          tytuly.add(t.lower()); wpisy.append({"t": t[:200], "l": l, "z": zrodlo, "d": d.isoformat(timespec="seconds")})
                  except Exception as e:
                      print("Nie udało się:", url, e)
              wpisy.sort(key=lambda w: w["d"], reverse=True)
              wynik[dzial] = wpisy[:25]
          if wynik["polska"] or wynik["swiat"]:
              open("wiadomosci.json", "w", encoding="utf-8").write(json.dumps(wynik, ensure_ascii=False, indent=0))
          print({k: len(v) for k, v in wynik.items() if isinstance(v, list)})
      - name: Zapisz zmiany
        run: |
          git config user.name "wiadomosci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiadomosci.json
          git diff --cached --quiet || (git commit -m "Wiadomości: odświeżenie" && git push)
