# Moje Wirkowice — co 30 minut pobiera nagłówki (Polska i Świat) z RSS i zapisuje wiadomosci.json obok aplikacji.
# Telefony czytają ten plik z tego samego adresu co aplikacja, więc nie trzeba żadnego serwera.
# W repozytorium ten plik leży w: .github/workflows/wiadomosci.yml
name: Wiadomości
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: wiadomosci
  cancel-in-progress: false
jobs:
  pobierz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Pobierz nagłówki
        shell: python
        run: |
          import json, urllib.request, xml.etree.ElementTree as ET, datetime, email.utils, zoneinfo
          # Działy: polska i swiat (zakładka „Ogólne”), religia, rolnicze. Najwyżej 12 nagłówków z jednego źródła, 25 w dziale.
          ZRODLA = {
            "polska":   [("RMF24", "https://www.rmf24.pl/fakty/polska/feed"), ("Onet", "https://wiadomosci.onet.pl/kraj.feed")],
            "swiat":    [("RMF24", "https://www.rmf24.pl/fakty/swiat/feed"),  ("Onet", "https://wiadomosci.onet.pl/swiat.feed")],
            "religia":  [("Vatican News", "https://www.vaticannews.va/pl.rss.xml"), ("Archidiecezja Lubelska", "https://www.archidiecezjalubelska.pl/feed/"),
                         ("Stacja7", "https://stacja7.pl/feed/")],
            "rolnicze": [("Tygodnik Poradnik Rolniczy", "https://www.tygodnik-rolniczy.pl/rss"), ("Agrofakt", "https://www.agrofakt.pl/feed/"),
                         ("agroPolska", "https://www.agropolska.pl/rss/")],
          }
          try: PL = zoneinfo.ZoneInfo("Europe/Warsaw")
          except Exception: PL = datetime.timezone(datetime.timedelta(hours=1))
          def data(s):
              s = (s or "").strip()
              try: return email.utils.parsedate_to_datetime(s).astimezone(datetime.timezone.utc)
              except Exception: pass
              for f in ("%Y/%m/%d %H:%M", "%Y-%m-%d %H:%M:%S", "%Y-%m-%dT%H:%M:%S%z"):
                  try:
                      d = datetime.datetime.strptime(s, f)
                      return (d if d.tzinfo else d.replace(tzinfo=PL)).astimezone(datetime.timezone.utc)
                  except Exception: pass
              return None
          def pobierz(url):
              req = urllib.request.Request(url, headers={"User-Agent": "MojeWirkowice/1.0 (+https://adamczochrowski-netizen.github.io/wk2-mapa-t7x/)"})
              return ET.fromstring(urllib.request.urlopen(req, timeout=15).read())
          teraz = datetime.datetime.now(datetime.timezone.utc)
          wynik = {"zaktualizowano": teraz.isoformat(timespec="seconds")}
          for dzial, lista in ZRODLA.items():
              wpisy, tytuly = [], set()
              for zrodlo, url in lista:
                  ile = 0
                  try:
                      for it in pobierz(url).iter("item"):
                          t = " ".join((it.findtext("title") or "").split()); l = (it.findtext("link") or "").strip()
                          d = data(it.findtext("pubDate"))
                          if not t or not l.startswith("http") or t.lower() in tytuly or not d or d > teraz + datetime.timedelta(hours=1): continue
                          tytuly.add(t.lower()); wpisy.append({"t": t[:200], "l": l, "z": zrodlo, "d": d.isoformat(timespec="seconds")})
                          ile += 1
                          if ile >= 12: break
                  except Exception as e:
                      print("Nie udało się:", url, e)
                  print(dzial, zrodlo, ile)
              wpisy.sort(key=lambda w: w["d"], reverse=True)
              wynik[dzial] = wpisy[:25]
          if any(wynik[k] for k in ZRODLA):
              open("wiadomosci.json", "w", encoding="utf-8").write(json.dumps(wynik, ensure_ascii=False, indent=0))
          print({k: len(v) for k, v in wynik.items() if isinstance(v, list)})
      - name: Zapisz zmiany
        run: |
          git config user.name "wiadomosci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiadomosci.json
          git diff --cached --quiet || (git commit -m "Wiadomości: odświeżenie" && git push)
