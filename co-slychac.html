<body>
<title>Co słychać · Moje Wirkowice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="wspolne.css">

<style>
/* Filtry „Wydarzeń w okolicy”: kiedy i gdzie */
.filtry{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.filtry button{font:inherit;font-weight:600;font-size:15px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.filtry button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.filtry button:focus-visible{outline:2px solid var(--h);outline-offset:2px}
.filtry.gdzie button{font-size:14px;padding:5px 11px}
.filtry .ile{opacity:.65;font-weight:400;margin-left:4px}
.ile-wyd{font-size:14px;color:var(--muted);margin:0 0 10px}
/* Prąd i woda */
.wyl{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.wyl .i{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,#E3C26B 20%,var(--panel));color:#E3C26B}
.wyl .i.w{background:color-mix(in srgb,#6CC4D6 20%,var(--panel));color:#6CC4D6}
.wyl .i svg{width:18px;height:18px}
.wyl b{display:block}
.wyl small{display:block;color:var(--muted);font-size:14px;margin-top:2px;line-height:1.4}
.wyl.nasze{border-color:#E3C26B;background:color-mix(in srgb,#E3C26B 12%,var(--panel))}
.wyl.odw{opacity:.6}
.wyl.odw b{text-decoration:line-through}
.wyl a{color:var(--h)}
.wyl-zr{font-size:12px;color:var(--muted);margin:10px 0 0}
.wyl-zr a{color:var(--muted)}
</style>
<main class="wrap h-nieb">
  <a class="back" href="index.html">← Moje Wirkowice</a>
  <header class="naglowek">
    <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3l5 4V6L7 10z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg></span>
    <div><h1>Co słychać</h1><p class="lead">Ogłoszenia, wyłączenia prądu i wody oraz wydarzenia w Wirkowicach i okolicy.</p></div>
  </header>

  <section class="section">
    <h2>Ogłoszenia</h2>
    <div id="ogl"><p class="muted">Wczytuję…</p></div>
  </section>

  <section class="section" id="wylaczenia">
    <h2>Prąd i woda</h2>
    <div id="wyl"><p class="muted">Wczytuję…</p></div>
  </section>

  <section class="section" id="wirkowice">
    <h2>Wydarzenia w Wirkowicach</h2>
    <div id="wydW"><p class="muted">Wczytuję…</p></div>
  </section>

  <section class="section" id="okolice">
    <h2>Wydarzenia w okolicy</h2>
    <div id="wydO"><p class="muted">Wczytuję…</p></div>
  </section>
</main>

<script src="dane.js"></script>
<script>
(async()=>{
  const DO_WYSLANIA=[];   // teksty do przycisków „Wyślij”
  let NOWE=new Set();
  // Ogłoszenia: najnowsze na górze, bez tych, którym minęła data „ważne do”
  const o=await wczytaj("Ogloszenia");
  const wszystkie=o.wiersze.filter(r=>r.tytul||r.tresc).sort((a,b)=>(data(b.data)||0)-(data(a.data)||0));
  const aktualne=ogloszenieAktualne;
  const ogl=wszystkie.filter(aktualne), oglMin=wszystkie.filter(r=>!aktualne(r));
  const w=await wczytaj("Wydarzenia");
  const zData=w.wiersze.filter(r=>r.nazwa&&data(r.data));
  const przyszle=zData.filter(r=>data(r.data)>=dzis());
  NOWE=nowe([...ogl,...przyszle].map(kluczWpisu));   // co przybyło od ostatniej wizyty
  const plakNowe=r=>NOWE.has(kluczWpisu(r))?'<span class="nowe-plak">Nowe</span>':"";
  const btnWyslij=(r,cls)=>{ const d=data(r.data);
    const t=r.tytul?[r.tytul, d?ladnaData(d)+" "+d.getFullYear():"", r.tresc].filter(Boolean).join("\n")
      :[r.nazwa, [d?DNI[d.getDay()]+", "+ladnaData(d):"", r.godzina].filter(Boolean).join(", "), gdzieWyd(r), r.opis].filter(Boolean).join("\n");
    DO_WYSLANIA.push([r.tytul||r.nazwa, t]); return `<button type="button" class="${cls}" data-wyslij="${DO_WYSLANIA.length-1}">Wyślij</button>`; };
  // Długi opis: pierwsze zdanie widać od razu, reszta po dotknięciu „Czytaj więcej”
  const opisO=t=>{ if(!t) return ""; const i=t.search(/[.!?]\s/);
    if(t.length<=160||i<0||i>200) return `<p class="op">${esc(t)}</p>`;
    return `<p class="op">${esc(t.slice(0,i+1))}</p><details><summary>Czytaj więcej</summary><p class="op">${esc(t.slice(i+2))}</p></details>`; };
  const kartaO=r=>{ const d=data(r.data);
    return `<article class="kartka"><span class="k">${d?esc(kiedy(d)):"Ogłoszenie"}${plakNowe(r)}</span><h2 class="t">${esc(r.tytul)}</h2>${aktualne(r)?przyciskCzytaj(["Ogłoszenie. ",r.tytul,". ",d?kiedy(d)+". ":"",r.tresc||""].join("")):""}${opisO(r.tresc)}${/^https?:\/\//.test(r.link||"")?`<a class="link" href="${esc(r.link)}" target="_blank" rel="noopener">Więcej informacji ↗</a>`:""}${aktualne(r)?btnWyslij(r,"wyslij"):""}</article>`; };
  document.getElementById("ogl").innerHTML=(o.przyklad?notkaPrzyklad:"")+(o.zapisane?'<p class="muted">Brak internetu — pokazuję ostatnio zapisane.</p>':"")+
    (ogl.length?'<div class="list">'+ogl.map(kartaO).join("")+'</div>'
      :'<div class="card empty"><p style="margin:0">Brak aktualnych ogłoszeń.</p></div>')+
    minione(oglMin.length,oglMin.slice(0,30).map(kartaO).join(""));

  // Wydarzenia: nadchodzące od najbliższego; minione zwinięte, od najświeższego
  const MS=["STY","LUT","MAR","KWI","MAJ","CZE","LIP","SIE","WRZ","PAŹ","LIS","GRU"], DS=["niedz.","pon.","wt.","śr.","czw.","pt.","sob."];
  const kartaW=(r,przyszle)=>{ const d=data(r.data), n=dniDo(d);
    return `<article class="kal${przyszle&&n<=1?" hot":""}" style="align-items:start">
      <span class="kal-k" aria-hidden="true"><span class="kal-m">${MS[d.getMonth()]}</span><span class="kal-d">${d.getDate()}</span><span class="kal-w">${DS[d.getDay()]}</span></span>
      <span class="kal-x"><span class="k" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700">${esc(kiedy(d))}${r.godzina?" · "+esc(r.godzina):""}${przyszle?plakNowe(r):""}</span>
        <h2 style="margin:0">${esc(r.nazwa)}</h2>${gdzieWyd(r)?`<span class="m">${esc(gdzieWyd(r))}</span>`:""}
        ${r.opis?`<p style="margin:4px 0 0;white-space:pre-line">${esc(r.opis)}</p>`:""}
        ${przyszle?przyciskCzytaj([r.nazwa,". ",kiedy(d),r.godzina?", godzina "+r.godzina:"",". ",gdzieWyd(r)?gdzieWyd(r)+". ":"",r.opis||""].join("")):""}
        ${przyszle&&n>1?`<span class="cnt">za ${n} dni</span>`:""}
        ${przyszle||/^https?:/.test(r.link||"")?`<div class="btns">${przyszle?`<a class="btn" href="${kalendarz(r,d)}" target="_blank" rel="noopener">Dodaj do kalendarza</a>`+btnWyslij(r,"btn"):""}${/^https?:/.test(r.link||"")?`<a class="btn" href="${esc(r.link)}" target="_blank" rel="noopener">Więcej informacji ↗</a>`:""}</div>`:""}</span></article>`; };
  // Dwie listy: we wsi i w okolicy; w każdej nadchodzące od najbliższego, minione zwinięte
  const lista=(el,wiersze,pusto)=>{
    const wyd=wiersze.filter(r=>data(r.data)>=dzis()).sort((a,b)=>data(a.data)-data(b.data));
    const wydMin=wiersze.filter(r=>data(r.data)<dzis()).sort((a,b)=>data(b.data)-data(a.data));
    document.getElementById(el).innerHTML=(w.przyklad?notkaPrzyklad:"")+
      (wyd.length?'<div class="list">'+wyd.map(r=>kartaW(r,true)).join("")+'</div>'
        :`<div class="card empty"><p style="margin:0">${pusto}</p></div>`)+
      minione(wydMin.length,wydMin.slice(0,30).map(r=>kartaW(r,false)).join(""));
  };
  lista("wydW",zData.filter(r=>!wOkolicy(r)),"Brak zaplanowanych wydarzeń w Wirkowicach.");
  // Prąd i woda: planowe wyłączenia PGE (najpierw gmina Izbica, przycisk „cała okolica”) i komunikaty o wodzie
  wczytajWylaczenia().then(W=>{
    const el=document.getElementById("wyl");
    if(!W){ el.innerHTML='<div class="card empty"><p style="margin:0">Nie udało się wczytać informacji o wyłączeniach. Sprawdź internet.</p></div>'; return; }
    const ikP='<span class="i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></span>';
    const ikW='<span class="i w" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg></span>';
    const teraz=new Date(), prad=(W.prad||[]).filter(w=>dataGodz(w.do)>teraz);
    let caly=false; try{ caly=sessionStorage.getItem("wirk-wyl-caly")==="1"; }catch(e){}
    const karta=w=>{ const od=dataGodz(w.od), nasze=wWirkowicach(w);
      return `<div class="wyl${nasze?" nasze":""}${w.odwolane?" odw":""}">${ikP}<span><b>${nasze?"Wirkowice! ":""}${esc(kiedy(od))}, ${godzMin(od)}–${godzMin(dataGodz(w.do))}${w.odwolane?" (odwołane)":""}</b><small>${esc(w.miejsca.join(", "))}<br>gmina ${esc(w.gminy.join(", "))}</small></span></div>`; };
    const rysuj=()=>{
      const l=caly?prad:prad.filter(w=>w.gminy.includes("Izbica"));
      const woda=(W.woda||[]).map(w=>`<div class="wyl">${ikW}<span><b>${esc(zdanie(w.t))}</b><small>${w.opis?esc(w.opis)+"<br>":""}${esc(w.z)}, ${esc(ladnaData(new Date(w.d)))} · <a href="${esc(w.l)}" target="_blank" rel="noopener">czytaj komunikat ↗</a></small></span></div>`).join("");
      el.innerHTML=`<div class="filtry" role="group" aria-label="Zasięg"><button type="button" data-zas="0" aria-pressed="${!caly}">Gmina Izbica</button><button type="button" data-zas="1" aria-pressed="${caly}">Cała okolica (${prad.length})</button></div>`+
        `<div class="list">${l.length?l.map(karta).join(""):`<div class="card empty"><p style="margin:0">${caly?"Brak planowanych wyłączeń prądu w okolicy w najbliższych 2 tygodniach.":"Brak planowanych wyłączeń prądu w gminie Izbica w najbliższych 2 tygodniach."}</p></div>`}${woda}</div>`+
        `<p class="wyl-zr">Prąd: planowane wyłączenia <a href="https://pgedystrybucja.pl/wylaczenia/planowane-wylaczenia" target="_blank" rel="noopener">PGE Dystrybucja</a>, na 2 tygodnie naprzód. Woda: komunikaty <a href="https://www.gpgkizbica.pl/" target="_blank" rel="noopener">GPGK Izbica</a> i gminy z ostatnich 3 tygodni. Awaria prądu: tel. 991.</p>`;
    };
    rysuj();
    el.addEventListener("click",e=>{ const b=e.target.closest("[data-zas]"); if(!b) return; caly=b.dataset.zas==="1"; try{ sessionStorage.setItem("wirk-wyl-caly",caly?"1":"0"); }catch(_){} rysuj(); });
  });
  // Okolica: dużo pozycji — filtry „kiedy” (tydzień / miesiąc / wszystko) i „gdzie” (miejscowość)
  const okol=zData.filter(wOkolicy), okolPrzysz=okol.filter(r=>data(r.data)>=dzis());
  let KIEDY="miesiac", GDZIE="";
  try{ KIEDY=sessionStorage.getItem("wirk-wyd-kiedy")||KIEDY; GDZIE=sessionStorage.getItem("wirk-wyd-gdzie")||""; }catch(e){}
  const wZakresie=r=>{ const n=dniDo(data(r.data)); return KIEDY==="tydzien"?n<=7:KIEDY==="miesiac"?n<=31:true; };
  const miejsc=[...new Set(okolPrzysz.map(r=>r.miejscowosc.trim()))].sort((a,b)=>a.localeCompare(b,"pl"));
  if(GDZIE&&!miejsc.includes(GDZIE)) GDZIE="";
  const rysujOkolice=()=>{
    const pas=okolPrzysz.filter(r=>wZakresie(r)&&(!GDZIE||r.miejscowosc.trim()===GDZIE));
    const ileW=m=>okolPrzysz.filter(r=>wZakresie(r)&&r.miejscowosc.trim()===m).length;
    const btn=(k,v,t)=>`<button type="button" data-${k}="${esc(v)}" aria-pressed="${String((k==="kiedy"?KIEDY:GDZIE)===v)}">${t}</button>`;
    const filtry=okolPrzysz.length>4?`<div class="filtry" role="group" aria-label="Kiedy">${btn("kiedy","tydzien","Ten tydzień")}${btn("kiedy","miesiac","Ten miesiąc")}${btn("kiedy","wszystko","Wszystko")}</div>
      <div class="filtry gdzie" role="group" aria-label="Gdzie">${btn("gdzie","","Wszędzie")}${miejsc.map(m=>btn("gdzie",m,esc(m)+`<span class="ile">${ileW(m)}</span>`)).join("")}</div>
      <p class="ile-wyd">${pas.length?`Pokazuję ${pas.length} z ${okolPrzysz.length} nadchodzących.`:""}</p>`:"";
    const el=document.getElementById("wydO");
    lista("wydO",okol.filter(r=>data(r.data)<dzis()||(wZakresie(r)&&(!GDZIE||r.miejscowosc.trim()===GDZIE))),
      okolPrzysz.length?"Nic w tym czasie i miejscu. Wybierz „Wszystko” albo inną miejscowość.":"Brak zaplanowanych wydarzeń w okolicy.");
    el.insertAdjacentHTML("afterbegin",filtry);
  };
  rysujOkolice();
  document.getElementById("wydO").addEventListener("click",e=>{
    const b=e.target.closest("[data-kiedy],[data-gdzie]"); if(!b) return;
    if(b.dataset.kiedy!==undefined) KIEDY=b.dataset.kiedy; else GDZIE=b.dataset.gdzie;
    try{ sessionStorage.setItem("wirk-wyd-kiedy",KIEDY); sessionStorage.setItem("wirk-wyd-gdzie",GDZIE); }catch(_){}
    rysujOkolice();
  });
  oznaczWidziane([...ogl,...przyszle].map(kluczWpisu));   // obejrzane — przy następnej wizycie już nie „nowe”
  document.querySelector("main").addEventListener("click",e=>{ const b=e.target.closest("[data-wyslij]"); if(!b) return;
    const [t,txt]=DO_WYSLANIA[+b.dataset.wyslij]; wyslij(t,txt,b); });
})();
// Link do Kalendarza Google z wypełnionym wydarzeniem (2 godziny albo cały dzień)
function kalendarz(r,d){
  const p=n=>String(n).padStart(2,"0"), ymd=x=>`${x.getFullYear()}${p(x.getMonth()+1)}${p(x.getDate())}`;
  let dates;
  const m=/^(\d{1,2})[:.](\d{2})/.exec(r.godzina||"");
  if(m){ const s=new Date(d); s.setHours(+m[1],+m[2]); const e=new Date(s.getTime()+2*3600e3);
    const t=x=>`${ymd(x)}T${p(x.getHours())}${p(x.getMinutes())}00`; dates=`${t(s)}/${t(e)}`; }
  else { const e=new Date(d); e.setDate(e.getDate()+1); dates=`${ymd(d)}/${ymd(e)}`; }
  const q=new URLSearchParams({action:"TEMPLATE",text:r.nazwa,dates,details:r.opis||"",location:(r.miejsce?r.miejsce+", ":"")+(wOkolicy(r)?r.miejscowosc:"Wirkowice"),ctz:"Europe/Warsaw"});
  return "https://calendar.google.com/calendar/render?"+q.toString();
}
</script>

</body>
